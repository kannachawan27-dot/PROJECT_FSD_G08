<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G8 Bakery | Admin Login</title>
  <link rel="stylesheet" href="../CSS/G8.css">
</head>
<body>
  <main class="admin-login">
    <form class="login-card" id="adminLoginForm">
      <h1>G8 Bakery</h1>
      <p>Admin Dashboard Login</p>
      <label for="adminUsername">Username</label>
      <input id="adminUsername" type="text" autocomplete="username" required>
      <label for="adminPassword">Password</label>
      <input id="adminPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
      <p id="loginMessage" role="alert"></p>
    </form>
  </main>
  <script src="../JS/G8owner-login.js"></script>
</body>
</html>
